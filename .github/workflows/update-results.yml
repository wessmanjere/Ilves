name: Päivitä ottelutulokset

on:
  schedule:
    # Ajetaan joka toinen tunti klo 7-22 (UTC, eli 10-01 Suomen aikaa)
    - cron: '0 7-22/2 * * *'
  workflow_dispatch:  # Voidaan ajaa myös käsin

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Hae repositorio
        uses: actions/checkout@v4

      - name: Asenna Playwright
        run: |
          pip install playwright --break-system-packages
          playwright install chromium --with-deps

      - name: Hae tulokset Palloliitosta
        run: python3 fetch_results.py

      - name: Tallenna muutokset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --staged --quiet; then
            echo "Ei uusia tuloksia."
          else
            git commit -m "Päivitä tulokset $(date -u +'%d.%m.%Y %H:%M') UTC"
            git push
          fi
