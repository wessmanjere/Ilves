<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ilves – Piirisarjat 2026 – Otteluohjelmat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0;
            background: #f0f0f0;
            color: #222;
        }
        header {
            background: #000;
            color: #FFCB00;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        header h1 { margin: 0; font-size: 1.3em; font-weight: bold; }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 10px 16px;
            background: #1a1a1a;
            border-bottom: 3px solid #FFCB00;
        }
        .tab-btn {
            background: #333;
            color: #ccc;
            border: none;
            padding: 7px 13px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.82em;
            transition: background 0.15s;
        }
        .tab-btn:hover { background: #555; color: #fff; }
        .tab-btn.active {
            background: #FFCB00;
            color: #000;
            font-weight: bold;
        }
        .content { padding: 16px; max-width: 1000px; }
        .team-section { display: none; }
        .team-section.active { display: block; }
        .team-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000;
            border-left: 4px solid #FFCB00;
            padding-left: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            font-size: 0.88em;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        thead th {
            background: #000;
            color: #FFCB00;
            padding: 9px 10px;
            text-align: left;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        tbody tr { border-bottom: 1px solid #f0f0f0; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #fffce6; }
        td { padding: 7px 10px; }
        td.score { font-weight: bold; color: #000; }
        caption { display: none; }
        .loading { color: #888; padding: 20px 0; font-style: italic; }
        .error { color: #c00; padding: 20px 0; }
        .updated { font-size: 0.75em; color: #999; margin-top: 12px; }
        @media (max-width: 640px) {
            .tabs { padding: 8px; gap: 3px; }
            .tab-btn { font-size: 0.75em; padding: 6px 9px; }
            .content { padding: 10px; }
            thead th, td { padding: 6px 7px; font-size: 0.8em; }
            /* Hide match number and field on small screens */
            th:nth-child(1), td:nth-child(1),
            th:nth-child(4), td:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Ilves – Piirisarjat 2026 – Otteluohjelmat</h1>
        </div>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="content">
        <div id="content"></div>
    </div>

    <script>
    var TEAMS = [
        {id: '35186280', name: 'Ilves / P2017'},
        {id: '35186299', name: 'Ilves Keltainen A'},
        {id: '35186284', name: 'Ilves Keltainen B'},
        {id: '35186295', name: 'Ilves Keltainen C'},
        {id: '35213619', name: 'Ilves / Keltavihreä A'},
        {id: '35213621', name: 'Ilves / Keltavihreä B'},
        {id: '35186300', name: 'Ilves Vihreä A'},
        {id: '35186298', name: 'Ilves Vihreä B'}
    ];

    function fetchTeam(team) {
        var url = 'https://spl.torneopal.fi/taso/widget.php?teamid=' + team.id + '&widget=schedule&cache=' + Date.now();
        return fetch(url)
            .then(function(r) { return r.text(); })
            .then(function(txt) {
                var m = txt.match(/document\.write\("([\s\S]*)"\);/);
                if (!m) return null;
                var html = m[1]
                    .replace(/\\"/g, '"')
                    .replace(/\\'/g, "'")
                    .replace(/\\\\/g, '\\');
                var tmp = document.createElement('div');
                tmp.innerHTML = html;
                // Remove embedded scripts
                var scripts = tmp.querySelectorAll('script, style');
                scripts.forEach(function(s) { s.remove(); });
                return tmp.querySelector('table');
            });
    }

    function buildTable(tbl, teamName) {
        if (!tbl) return '<p class="error">Ei otteluohjelmaa.</p>';
        // Replace score column classes for styling
        var tds = tbl.querySelectorAll('td');
        tds.forEach(function(td) {
            if (td.className.indexOf('score') !== -1) td.className = 'score';
        });
        return tbl.outerHTML;
    }

    function showTab(idx) {
        document.querySelectorAll('.tab-btn').forEach(function(b, i) {
            b.classList.toggle('active', i === idx);
        });
        document.querySelectorAll('.team-section').forEach(function(s, i) {
            s.classList.toggle('active', i === idx);
        });
    }

    var tabsEl = document.getElementById('tabs');
    var contentEl = document.getElementById('content');
    var now = new Date();
    var ts = now.toLocaleDateString('fi-FI') + ' ' + now.toLocaleTimeString('fi-FI', {hour:'2-digit', minute:'2-digit'});

    TEAMS.forEach(function(team, i) {
        var btn = document.createElement('button');
        btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        btn.textContent = team.name;
        btn.setAttribute('data-idx', i);
        btn.onclick = function() { showTab(i); };
        tabsEl.appendChild(btn);

        var section = document.createElement('div');
        section.className = 'team-section' + (i === 0 ? ' active' : '');
        section.innerHTML = '<div class="team-title">' + team.name + '</div><p class="loading">Ladataan otteluohjelmaa...</p>';
        contentEl.appendChild(section);

        fetchTeam(team).then(function(tbl) {
            var html = buildTable(tbl, team.name);
            section.innerHTML = '<div class="team-title">' + team.name + '</div>' + html
                + '<p class="updated">Päivitetty: ' + ts + '</p>';
        }).catch(function(err) {
            section.innerHTML = '<div class="team-title">' + team.name + '</div>'
                + '<p class="error">Virhe ladattaessa tietoja: ' + err.message + '</p>';
        });
    });
    </script>
</body>
</html>
